service: tunaywasi-beta-invite

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 256
  timeout: 15
  environment:
    GOOGLE_SERVICE_ACCOUNT: ${env:GOOGLE_SERVICE_ACCOUNT}
    FIREBASE_APP_ID: ${env:FIREBASE_APP_ID}
    FIREBASE_PROJECT_ID: ${env:FIREBASE_PROJECT_ID}
    EMAILJS_SERVICE_ID: ${env:EMAILJS_SERVICE_ID}
    EMAILJS_TEMPLATE_ID: ${env:EMAILJS_TEMPLATE_ID}
    EMAILJS_PUBLIC_KEY: ${env:EMAILJS_PUBLIC_KEY}
    EMAILJS_PRIVATE_KEY: ${env:EMAILJS_PRIVATE_KEY}
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, '*'}

functions:
  betaInvite:
    handler: handler.betaInvite
    events:
      - httpApi:
          path: /beta-invite
          method: post
      - httpApi:
          path: /beta-invite
          method: options
